name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '12.*'
            testbench: '^10.0'
          - php: '8.5'
            laravel: '12.*'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '13.*'
            testbench: '^11.0'
          - php: '8.5'
            laravel: '13.*'
            testbench: '^11.0'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          coverage: none
      - run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
      - run: composer update --prefer-dist --no-interaction --with-all-dependencies
      - run: vendor/bin/phpunit
